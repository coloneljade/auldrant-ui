pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{ts,tsx,css,json}"
      run: bunx biome check {staged_files}
      env:
        PATH: $HOME/.bun/bin:$PATH
    typecheck:
      run: bun run typecheck
      env:
        PATH: $HOME/.bun/bin:$PATH
    licenses:
      run: bun run licenses
      env:
        PATH: $HOME/.bun/bin:$PATH
