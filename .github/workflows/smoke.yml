name: Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Link package
        run: bun link

      - name: Install smoke test
        working-directory: tests/smoke
        run: bun install && bun link @auldrant/ui

      - name: Type-check smoke test
        working-directory: tests/smoke
        run: bunx tsc --noEmit
